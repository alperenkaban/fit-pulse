name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env file for mobile build
        working-directory: mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://ufolevhtefxmtjeeqxil.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_SdHTchHRadcFHQnI2TAytA_BcrFM6Fs" >> .env

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Native Android Project (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk FitPulse.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FitPulse-Android-APK
          path: FitPulse.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: FitPulse Mobil v1.0.0 (Android APK)
          body: |
            ### ⚡ FitPulse Android Mobil Uygulaması Hazır!
            - Doğrudan telefonunuza indirip kurabilirsiniz.
            - Gerçek yerel (Native) Android uygulamasıdır.
          files: FitPulse.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
